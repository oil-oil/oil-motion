name: 凭据页面与业务绑定
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts/credential-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: git diff --exit-code -- public/app.js
      - run: npm test
